[project]
name = "client"
version = "0.1.0"
description = "A desktop-integrated creature simulation featuring autonomous souls with LLM-driven behaviors."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=11.0.0",
    "pyautogui>=0.9.54",
    "pyglet>=2.1.6",
    "pystray>=0.19.5",
    "ttkbootstrap>=1.20.1",
    "watchdog>=6.0.0",
    "python-dotenv>=1.2.1",
    "websockets>=15.0.1",
    "goapauto>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1"
]

[tool.pytest.ini_options]
addopts = "-ra -q"
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\] ResumabilityConfig:UserWarning",
]
