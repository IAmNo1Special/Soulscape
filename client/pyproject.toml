[project]
name = "client"
version = "0.1.0"
description = "A desktop-integrated creature simulation featuring autonomous souls with LLM-driven behaviors."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=11.0.0",
    "pyautogui>=0.9.54",
    "pyglet>=2.1.6",
    "pystray>=0.19.5",
    "ttkbootstrap>=1.20.1",
    "watchdog>=6.0.0",
    "python-dotenv>=1.2.1",
    "websockets>=15.0.1",
    "goapauto>=0.6.1",
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }


[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "uvicorn>=0.40.0",
    "fastapi>=0.128.6",
    "argon2-cffi>=23.1.0",
    "cryptography>=50.0.1",
    "typesafe-sdk>=0.7.0",
]

[tool.pytest.ini_options]
addopts = "-ra -q"
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\] ResumabilityConfig:UserWarning",
]
