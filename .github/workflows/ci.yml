name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: IAmNo1Special/actions/.github/workflows/python-ci.yml@v1
    with:
      install-command: "uv sync --frozen"
      run-lint: false
      test-env-json: '{"HUB_SECRET_KEY": "soulscape-secret-123"}'
      test-commands: |
        uv run --package shared python -m pytest shared/tests/ -q -p no:cacheprovider
        uv run --package client python -m pytest client/tests/unit/test_capture_guard.py -q -p no:cacheprovider
        xvfb-run -a uv run --package client python -m pytest client/tests/unit -q -p no:cacheprovider
        uv run --package server python -m pytest server/tests/ -q -p no:cacheprovider
